[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Android's native activity: Horizon's game in the phone's own folders"
publish = false

[lib]
name = "horizon_android"
crate-type = ["cdylib"]

[dependencies]
# No `controllers` (gilrs has no Android backend) and no `audio` yet: the phone plays with the
# on-screen touch controls, which need neither.
horizon-client = { path = "../horizon-client", default-features = false, features = [
    "horizon-extras",
] }
horizon-core = { path = "../horizon-core" }
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-mod-host = { path = "../horizon-mod-host", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = [
    "index",
    "runtime-process",
] }
horizon-official = { path = "../horizon-official", default-features = false }
log = "0.4"
winit = "0.30.13"

[target.'cfg(target_os = "android")'.dependencies]
# The NativeActivity glue: it loads this library, starts `android_main` and hands it the app.
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true
