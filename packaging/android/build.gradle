plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.horizon.android'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters providers.gradleProperty('abi').getOrElse('arm64-v8a') }
    }
    buildTypes {
        debug {
            // Signed with Gradle's debug key; no release signing material is kept here.
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        // Cargo's output for the chosen ABI, copied by tools/android_build.py.
        jniLibs.srcDirs = ['../../.local/android/jniLibs']
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
layout.buildDirectory = file('../../.local/android/gradle-build')
